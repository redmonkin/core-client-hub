name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't** use this form for security vulnerabilities. See SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where are you running Clientra?
      options:
        - Hosted instance
        - Self-hosted
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 128 on macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Console errors, logs or screenshots
      description: Please remove any personal or client data first.
