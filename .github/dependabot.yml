# Keeps dependency PRs (and the CI, CodeQL and Vercel preview runs each one
# triggers) to a minimum:
#   * version updates arrive once a month, as one grouped PR per ecosystem;
#   * major versions are never proposed: they usually need code changes, so
#     we upgrade them on purpose, in our own PR;
#   * security fixes still arrive as soon as an advisory is published
#     (Settings → Code security → Dependabot security updates), batched into
#     a single PR instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    ignore:
      # Applies to version updates only; security updates are not affected.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
